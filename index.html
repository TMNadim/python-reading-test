<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Reading Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #e0f2fe 100%);
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 20px;
    padding: 40px 28px 32px;
    box-shadow: 0 12px 40px rgba(15, 23, 42, .10);
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: #eef2ff;
    color: #4338ca;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .4px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 1.65rem;
    margin: 0 0 10px;
    letter-spacing: -.4px;
  }
  .sub {
    color: #64748b;
    font-size: .97rem;
    line-height: 1.55;
    margin: 0 0 30px;
  }
  .test-btn {
    display: block;
    text-decoration: none;
    background: #3b82f6;
    color: #fff;
    border-radius: 14px;
    padding: 20px 18px;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 6px 18px rgba(59, 130, 246, .35);
  }
  .test-btn:hover {
    background: #2563eb;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(59, 130, 246, .40);
  }
  .test-btn:active { transform: translateY(0); }
  .btn-label {
    display: block;
    font-size: 1.15rem;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .btn-meta {
    display: block;
    font-size: .82rem;
    opacity: .85;
    font-weight: 500;
  }
  .foot {
    margin: 26px 0 0;
    font-size: .85rem;
    color: #94a3b8;
  }
  @media (max-width: 400px) {
    .wrap { padding: 32px 20px 26px; }
    h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>

  <main class="wrap">
    <span class="badge">🐍 Python Basics</span>

    <h1>Python Reading Test</h1>
    <p class="sub">
      Read short Python code and write what you think it will print.
    </p>

    <!-- ✏️ Rename this button text anytime -->
    <a class="test-btn" href="test.html">
      <span class="btn-label">Call 1 — Reading Test</span>
      <span class="btn-meta">10 questions · about 10 minutes</span>
    </a>

    <p class="foot">Read each line slowly. Good luck! 🍀</p>
  </main>

</body>
</html>
