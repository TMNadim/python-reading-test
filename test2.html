<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Reading Test — Day 2</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 70px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #eef2f7;
    color: #1e293b;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 720px; margin: 0 auto; }

  .back {
    display: inline-block;
    margin-bottom: 16px;
    color: #64748b;
    text-decoration: none;
    font-size: .88rem;
    font-weight: 600;
  }
  .back:hover { color: #3b82f6; }

  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 1.6rem; margin: 0 0 6px; }
  header p  { margin: 0; color: #64748b; font-size: .95rem; }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 26px;
    box-shadow: 0 6px 24px rgba(15, 23, 42, .08);
  }

  /* ---------- progress ---------- */
  .progress-row {
    display: flex;
    justify-content: space-between;
    font-size: .82rem;
    font-weight: 700;
    color: #64748b;
    margin-bottom: 8px;
    letter-spacing: .3px;
    text-transform: uppercase;
  }
  .bar {
    height: 8px;
    background: #e2e8f0;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .bar > div {
    height: 100%;
    width: 0;
    background: #3b82f6;
    border-radius: 99px;
    transition: width .35s ease;
  }

  /* ---------- question ---------- */
  h2.q { font-size: 1.08rem; margin: 0 0 14px; }

  pre.code {
    background: #0f172a;
    color: #e2e8f0;
    padding: 16px 18px;
    border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .95rem;
    line-height: 1.65;
    margin: 0 0 18px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  pre.code.small { font-size: .85rem; padding: 12px 14px; }

  .note {
    background: #fffbeb;
    border-left: 4px solid #f59e0b;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: .9rem;
    margin-bottom: 16px;
  }

  /* ---------- options ---------- */
  .options { display: grid; gap: 10px; }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 600;
    color: #1e293b;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
  }
  .option:hover:not(:disabled) {
    border-color: #93c5fd;
    background: #eff6ff;
    transform: translateX(2px);
  }
  .option:disabled { cursor: default; }

  .opt-key {
    flex: 0 0 28px;
    height: 28px;
    display: grid;
    place-items: center;
    background: #e2e8f0;
    color: #475569;
    border-radius: 8px;
    font-size: .78rem;
    font-weight: 800;
  }
  .opt-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .93rem;
    line-height: 1.45;
    word-break: break-word;
  }

  .option.correct { border-color: #22c55e; background: #f0fdf4; }
  .option.correct .opt-key { background: #22c55e; color: #fff; }

  .option.wrong { border-color: #ef4444; background: #fef2f2; }
  .option.wrong .opt-key { background: #ef4444; color: #fff; }

  .option.dim { opacity: .5; }

  /* ---------- feedback ---------- */
  .feedback { margin-top: 18px; display: none; }
  .feedback.show { display: block; }

  .fb-title { font-weight: 800; font-size: 1.05rem; margin-bottom: 4px; }
  .feedback.ok .fb-title { color: #15803d; }
  .feedback.no .fb-title { color: #b91c1c; }

  .why {
    font-size: .9rem;
    color: #475569;
    line-height: 1.6;
    background: #f8fafc;
    border-radius: 8px;
    padding: 11px 14px;
    margin-top: 10px;
  }

  /* ---------- buttons ---------- */
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  button.btn {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 13px 26px;
    cursor: pointer;
    background: #3b82f6;
    color: #fff;
    transition: background .15s, transform .05s;
  }
  button.btn:hover  { background: #2563eb; }
  button.btn:active { transform: translateY(1px); }
  button.btn.ghost  { background: #e2e8f0; color: #1e293b; }
  button.btn.ghost:hover { background: #cbd5e1; }

  .hidden { display: none !important; }

  /* ---------- results ---------- */
  #results { text-align: center; }
  .score-big {
    font-size: 3rem;
    font-weight: 800;
    color: #3b82f6;
    line-height: 1.1;
    margin: 6px 0;
  }
  .score-msg { color: #475569; margin: 0 0 8px; font-size: 1rem; }

  .review { text-align: left; margin-top: 26px; display: grid; gap: 16px; }

  .review-item {
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    background: #fff;
  }
  .review-item.ok { border-color: #bbf7d0; background: #f0fdf4; }
  .review-item.no { border-color: #fecaca; background: #fef2f2; }

  .rev-head {
    display: flex;
    justify-content: space-between;
    font-weight: 800;
    font-size: .85rem;
    margin-bottom: 10px;
    color: #475569;
  }
  .review-item.ok .rev-mark { color: #15803d; }
  .review-item.no .rev-mark { color: #b91c1c; }

  .rev-opts { display: grid; gap: 5px; margin-top: 10px; }

  .rev-opt {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .86rem;
    padding: 7px 11px;
    border-radius: 7px;
    background: #f1f5f9;
    color: #475569;
    border: 1px solid transparent;
  }
  .rev-opt.rev-correct {
    background: #dcfce7;
    color: #14532d;
    border-color: #86efac;
    font-weight: 700;
  }
  .rev-opt.rev-wrong {
    background: #fee2e2;
    color: #7f1d1d;
    border-color: #fca5a5;
  }

  .rev-why { font-size: .86rem; color: #475569; margin-top: 12px; line-height: 1.55; }

  /* ---------- signature ---------- */
  .signature {
    text-align: center;
    margin-top: 28px;
    font-size: .82rem;
    color: #94a3b8;
    letter-spacing: .2px;
  }
  .signature strong { color: #64748b; font-weight: 700; }

  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
    header h1 { font-size: 1.35rem; }
    button.btn { width: 100%; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="app">

  <a href="index.html" class="back">← Back to home</a>

  <header>
    <h1>🧠 Python Reading Test — Day 2</h1>
    <p>Data types, operators, indexing and f-strings. Pick the correct output.</p>
  </header>

  <!-- ===== QUIZ ===== -->
  <main id="quiz" class="card">
    <div class="progress-row">
      <span>Question <span id="qnum">1</span> of <span id="qtotal">15</span></span>
      <span id="qscore">Score: 0</span>
    </div>
    <div class="bar"><div id="barfill"></div></div>

    <h2 class="q">What is the output of this code?</h2>
    <pre class="code"><code id="code"></code></pre>
    <div class="note hidden" id="note"></div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <div class="actions">
      <button id="nextBtn" class="btn hidden">Next question →</button>
    </div>

    <div class="signature">
      Made by <strong>Tanvir Mahatab Nadim</strong>
    </div>
  </main>

  <!-- ===== RESULTS ===== -->
  <section id="results" class="card hidden">
    <h1 style="font-size:1.4rem;margin:0 0 4px;">Your Result</h1>
    <div class="score-big" id="scoreBig">0 / 15</div>
    <p class="score-msg" id="scoreMsg"></p>
    <div class="review" id="review"></div>
    <div class="actions" style="justify-content:center;">
      <button id="restartBtn" class="btn ghost">🔄 Try again</button>
    </div>
    <div class="signature">
      Made by <strong>Tanvir Mahatab Nadim</strong>
    </div>
  </section>

</div>

<script>
/* ============================================================
   ✏️  DAY 2 QUESTIONS
   ------------------------------------------------------------
   code    : the Python code shown to the student
   note    : optional extra info ("" for none)
   options : the four choices
   correct : index of the right option (0 = first)
   explain : shown after the student answers
   ============================================================ */
const QUESTIONS = [
  {
    code: 'print(len("Python"))',
    note: '',
    options: ['5', '6', '7', 'Error'],
    correct: 1,
    explain: 'len() counts the characters inside the string. P-y-t-h-o-n = 6 characters.'
  },
  {
    code: 'print(type(5))',
    note: '',
    options: ["<class 'int'>", "<class 'float'>", "<class 'number'>", "<class 'str'>"],
    correct: 0,
    explain: '5 is a whole number, so Python stores it as an int (integer). type() tells us the data type.'
  },
  {
    code: 'print(type(5.0))',
    note: '',
    options: ["<class 'int'>", "<class 'float'>", "<class 'str'>", "<class 'decimal'>"],
    correct: 1,
    explain: 'Any number with a decimal point is a float — even when the decimal part is 0. So 5.0 is a float, not an int.'
  },
  {
    code: 'print(7 // 2)',
    note: '',
    options: ['3.5', '3', '4', '2'],
    correct: 1,
    explain: '// is integer (floor) division. It divides and throws away the decimal part. 7 ÷ 2 = 3.5 → 3.'
  },
  {
    code: 'print(7 / 2)',
    note: '',
    options: ['3', '3.5', '4', '3.0'],
    correct: 1,
    explain: 'A single / always gives a float answer. 7 / 2 = 3.5.'
  },
  {
    code: 'print(2 ** 3)',
    note: '',
    options: ['6', '8', '9', '23'],
    correct: 1,
    explain: '** means "to the power of". 2 ** 3 means 2 × 2 × 2 = 8.'
  },
  {
    code: 'name = "Nadim"\nprint(name[0])',
    note: '',
    options: ['N', 'n', 'Na', '0'],
    correct: 0,
    explain: 'Subscripting starts counting at 0. name[0] is the first character: N.'
  },
  {
    code: 'word = "Python"\nprint(word[-1])',
    note: '',
    options: ['P', 'n', 'o', 'Error'],
    correct: 1,
    explain: 'A negative index counts from the end. -1 is the last character, which is n.'
  },
  {
    code: 'print("Hello" + "World")',
    note: '',
    options: ['Hello World', 'HelloWorld', 'Hello+World', 'Error'],
    correct: 1,
    explain: '+ joins the strings together with nothing in between. If you want a space, you must add " " yourself.'
  },
  {
    code: 'print("Hi" * 3)',
    note: '',
    options: ['Hi3', 'HiHiHi', 'Hi Hi Hi', 'Error'],
    correct: 1,
    explain: 'A string times a number repeats the string that many times. "Hi" * 3 → HiHiHi.'
  },
  {
    code: 'age = 12\nprint(f"I am {age} years old")',
    note: '',
    options: ['I am {age} years old', 'I am 12 years old', 'I am age years old', 'Error'],
    correct: 1,
    explain: 'An f-string replaces {age} with the value stored inside the variable age. The f before the quotes is what makes it work.'
  },
  {
    code: 'print(type(10 / 2))',
    note: '',
    options: ["<class 'int'>", "<class 'float'>", "<class 'str'>", "<class 'bool'>"],
    correct: 1,
    explain: 'This one tricks a lot of students! The / operator ALWAYS gives a float, even when it divides evenly. 10 / 2 = 5.0, which is a float.'
  },
  {
    code: 'print(3 + 4 * 2)',
    note: '',
    options: ['14', '11', '24', '9'],
    correct: 1,
    explain: 'Multiplication happens before addition. 4 * 2 = 8 first, then 3 + 8 = 11.'
  },
  {
    code: 'word = "Python"\nprint(len(word) + len("Hi"))',
    note: '',
    options: ['6', '8', '62', 'Error'],
    correct: 1,
    explain: 'len("Python") is 6 and len("Hi") is 2. Then 6 + 2 = 8.'
  },
  {
    code: 'print(type("5"))',
    note: '',
    options: ["<class 'int'>", "<class 'float'>", "<class 'str'>", "<class 'char'>"],
    correct: 2,
    explain: 'Anything inside quotes is text, so "5" is a str (string) — not a number. This is different from type(5).'
  }
];

/* ============================================================
   App logic — no need to change below
   ============================================================ */

const TOTAL = QUESTIONS.length;
let idx = 0, score = 0, results = [], answered = false;

const $ = id => document.getElementById(id);
const quizEl    = $('quiz');
const resultsEl = $('results');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function renderQuestion() {
  const q = QUESTIONS[idx];
  answered = false;

  $('qnum').textContent   = idx + 1;
  $('qtotal').textContent = TOTAL;
  $('qscore').textContent = 'Score: ' + score;
  $('barfill').style.width = (idx / TOTAL * 100) + '%';

  $('code').textContent = q.code;

  const noteEl = $('note');
  if (q.note) {
    noteEl.textContent = q.note;
    noteEl.classList.remove('hidden');
  } else {
    noteEl.classList.add('hidden');
  }

  // build the option buttons
  const box = $('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    btn.dataset.index = i;

    const key = document.createElement('span');
    key.className = 'opt-key';
    key.textContent = String.fromCharCode(65 + i);   // A, B, C, D

    const txt = document.createElement('span');
    txt.className = 'opt-text';
    txt.textContent = opt;

    btn.appendChild(key);
    btn.appendChild(txt);
    btn.addEventListener('click', () => choose(i));
    box.appendChild(btn);
  });

  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('nextBtn').classList.add('hidden');
}

function choose(picked) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[idx];
  const isCorrect = picked === q.correct;
  if (isCorrect) score++;

  results.push({ q, picked, correct: isCorrect });

  $('qscore').textContent = 'Score: ' + score;

  // paint the options
  const btns = $('options').querySelectorAll('.option');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct)      btn.classList.add('correct');
    else if (i === picked)    btn.classList.add('wrong');
    else                      btn.classList.add('dim');
  });

  // feedback
  const fb = $('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'no');
  fb.innerHTML =
    '<div class="fb-title">' +
      (isCorrect ? '✅ Correct!' : '❌ Not quite — the right answer is ' +
        String.fromCharCode(65 + q.correct)) +
    '</div>' +
    '<div class="why">💡 ' + escapeHtml(q.explain) + '</div>';

  const nextBtn = $('nextBtn');
  nextBtn.textContent = (idx === TOTAL - 1) ? 'See my score 🎉' : 'Next question →';
  nextBtn.classList.remove('hidden');
  nextBtn.focus();
}

function nextQuestion() {
  idx++;
  if (idx >= TOTAL) showResults();
  else renderQuestion();
}

function showResults() {
  quizEl.classList.add('hidden');
  resultsEl.classList.remove('hidden');

  $('scoreBig').textContent = score + ' / ' + TOTAL;

  const pct = score / TOTAL;
  let msg;
  if (pct === 1)       msg = 'Perfect score! You have really mastered Day 2. 🏆';
  else if (pct >= 0.8) msg = 'Great job! Just a small thing or two to review. 👏';
  else if (pct >= 0.5) msg = 'Good start! Read the explanations below and try again. 💪';
  else                 msg = 'Keep practising! Read the explanations below carefully. 📘';
  $('scoreMsg').textContent = msg;

  $('review').innerHTML = results.map((r, i) => {
    const opts = r.q.options.map((o, oi) => {
      let cls = 'rev-opt';
      if (oi === r.q.correct) cls += ' rev-correct';
      else if (oi === r.picked) cls += ' rev-wrong';
      return '<div class="' + cls + '">' + escapeHtml(o) + '</div>';
    }).join('');

    return '' +
      '<div class="review-item ' + (r.correct ? 'ok' : 'no') + '">' +
        '<div class="rev-head">' +
          '<span>Question ' + (i + 1) + '</span>' +
          '<span class="rev-mark">' + (r.correct ? '✅ Correct' : '❌ Wrong') + '</span>' +
        '</div>' +
        '<pre class="code small">' + escapeHtml(r.q.code) + '</pre>' +
        '<div class="rev-opts">' + opts + '</div>' +
        '<div class="rev-why">💡 ' + escapeHtml(r.q.explain) + '</div>' +
      '</div>';
  }).join('');
}

function restart() {
  idx = 0; score = 0; results = []; answered = false;
  resultsEl.classList.add('hidden');
  quizEl.classList.remove('hidden');
  renderQuestion();
}

/* Events */
$('nextBtn').addEventListener('click', nextQuestion);
$('restartBtn').addEventListener('click', restart);

/* Keyboard: A–D or 1–4 to pick, Enter for next */
document.addEventListener('keydown', e => {
  if (quizEl.classList.contains('hidden')) return;

  if (e.key === 'Enter' && answered) { e.preventDefault(); nextQuestion(); return; }

  if (!answered) {
    const k = e.key.toUpperCase();
    const map = { A: 0, B: 1, C: 2, D: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
    if (k in map) {
      const i = map[k];
      if (i < QUESTIONS[idx].options.length) { e.preventDefault(); choose(i); }
    }
  }
});

/* Start */
renderQuestion();
</script>

</body>
</html>
